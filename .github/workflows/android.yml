name: Android build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch or PR cancels the older run. Tag runs (releases) are never
# cancelled, so a release in flight always finishes publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
# One codebase, two editions (product flavors): kitt2 = KITT Launcher.2, kitt = KITT Launcher.
# A tag (v1.8) releases all four editions, each to its own downloads repo for its in-app updater.
jobs:
  # Which editions the smoke test needs. Pull requests skip editions their changes can't reach
  # (.github/scripts/smoke-editions.sh); pushes, tags and manual runs always test all four.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      editions: ${{ steps.pick.outputs.editions }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Pick editions
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # A renamed file counts under both its old and new path.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] \
              && listed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | "\(.filename)\t\(.previous_filename // "")"') \
              && [ "$(printf '%s\n' "$listed" | grep -c .)" = "$PR_FILES" ]; then
            files=$(printf '%s\n' "$listed" | tr '\t' '\n' | grep . || true)
            echo "Changed files:"; printf '%s\n' "$files"
          else
            files=app/build.gradle.kts # not a pull request, or an incomplete list: a shared file tests all
          fi
          editions=$(printf '%s\n' "$files" | bash .github/scripts/smoke-editions.sh)
          echo "Editions to smoke test: $editions"
          echo "editions=$editions" >> "$GITHUB_OUTPUT"

  # Starts each edition on an emulator shaped like its head unit, visits every page and opens every
  # overlay (LauncherSmokeTest). A crash in any edition fails the build before it can be released.
  smoke:
    needs: changes
    if: needs.changes.outputs.editions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.changes.outputs.editions) }}
    name: smoke (${{ matrix.edition.flavor }})
    steps:
      # The emulator's data partition needs several GB the stock runner doesn't have free. First, so
      # nothing a later step installs is removed (the tool cache holds the Java setup-java adds).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Compiles the app and test APKs in the background while the emulator is installed and boots
      # (about a minute and a half), so the two overlap; the test step waits for the build.
      - name: Start building the app and test APKs
        run: |
          chmod +x gradlew
          nohup bash -c './gradlew --build-cache assemble${{ matrix.edition.flavor }}Debug assemble${{ matrix.edition.flavor }}DebugAndroidTest > "$RUNNER_TEMP/apk-build.log" 2>&1; echo $? > "$RUNNER_TEMP/apk-build.exit"' > /dev/null 2>&1 &

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 3G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size ${{ matrix.edition.size }}
            adb shell wm density 160
            bash .github/scripts/wait-for-apk-build.sh
            ./gradlew --build-cache connected${{ matrix.edition.flavor }}DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.aiconsole.kittlauncher2.LauncherSmokeTest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-test-report-${{ matrix.edition.flavor }}
          path: app/build/reports/androidTests/


  build:
    runs-on: ubuntu-latest
    env:
      KITT_KEYSTORE_BASE64: ${{ secrets.KITT_KEYSTORE_BASE64 }}
      KITT_KEYSTORE_PASSWORD: ${{ secrets.KITT_KEYSTORE_PASSWORD }}
      KITT_KEY_ALIAS: ${{ secrets.KITT_KEY_ALIAS }}
      KITT_KEY_PASSWORD: ${{ secrets.KITT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes list the commits since the previous tag

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5 # v6+ caching needs Gradle's proprietary terms

      # The classic editions share every source file but two tiny class stubs, so their tests and
      # lint run once. KITT Holo adds a redesign behind BuildConfig.HOLO_DESIGN, so it gets its own
      # tests and lint pass.
      - name: Unit tests, lint and debug APKs
        run: |
          chmod +x gradlew
          ./gradlew testKitt2DebugUnitTest lintKitt2Debug assembleKitt2Debug assembleKittDebug
          ./gradlew testHoloLandscapeDebugUnitTest lintHoloLandscapeDebug assembleHoloLandscapeDebug assembleHoloPortraitDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/kitt2/debug/app-kitt2-debug.apk
            app/build/outputs/apk/kitt/debug/app-kitt-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: holo-debug
          path: |
            app/build/outputs/apk/holoLandscape/debug/app-holoLandscape-debug.apk
            app/build/outputs/apk/holoPortrait/debug/app-holoPortrait-debug.apk

      # Signed releases for in-app updates, when the signing secrets are configured.
      - name: Signed release APKs
        if: env.KITT_KEYSTORE_BASE64 != ''
        run: |
          echo "$KITT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kitt.jks"
          KITT_KEYSTORE="$RUNNER_TEMP/kitt.jks" ./gradlew assembleKitt2Release assembleKittRelease assembleHoloLandscapeRelease assembleHoloPortraitRelease

      # On a tag, the signed APKs and notes go to the release job, which waits for the smoke test.
      - name: Prepare releases
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/kitt2/release/app-kitt2-release.apk') != ''
        run: |
          mkdir release
          cp app/build/outputs/apk/kitt2/release/app-kitt2-release.apk "release/KITT-Launcher.2-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/kitt/release/app-kitt-release.apk "release/KITT-Launcher-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/holoLandscape/release/app-holoLandscape-release.apk "release/KITT-Holo-Landscape-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/holoPortrait/release/app-holoPortrait-release.apk "release/KITT-Holo-Portrait-$GITHUB_REF_NAME.apk"
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          for edition in "KITT Launcher.2" "KITT Launcher" "KITT Holo Landscape" "KITT Holo Portrait"; do
            {
              echo "$edition $GITHUB_REF_NAME"
              echo
              echo "Download the APK below and open it on the head unit, or use KITT Config → Updates."
              echo
              echo "Changes:"
              git log --no-merges --pretty='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" | head -40
            } > "release/notes-${edition// /-}.md"
          done

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('release/*.apk') != ''
        with:
          name: release
          path: release/

  # Tags publish each signed APK to its public downloads-only repository, which that edition's
  # in-app updater checks, only once the build and the smoke test passed. RELEASES_TOKEN must be
  # allowed to write all four repositories.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release

      - name: Publish KITT Launcher.2
        uses: softprops/action-gh-release@v3
        with:
          repository: tdater/KITT-Launcher.2-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          name: KITT Launcher.2 ${{ github.ref_name }}
          body_path: release/notes-KITT-Launcher.2.md
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.8-beta1: only beta-channel units see it
          files: release/KITT-Launcher.2-${{ github.ref_name }}.apk

      - name: Publish KITT Launcher
        uses: softprops/action-gh-release@v3
        with:
          repository: tdater/KITT-Launcher-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          name: KITT Launcher ${{ github.ref_name }}
          body_path: release/notes-KITT-Launcher.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/KITT-Launcher-${{ github.ref_name }}.apk

      - name: Publish KITT Holo Landscape
        uses: softprops/action-gh-release@v3
        with:
          repository: tdater/KITT-Holo-Landscape-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          name: KITT Holo Landscape ${{ github.ref_name }}
          body_path: release/notes-KITT-Holo-Landscape.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/KITT-Holo-Landscape-${{ github.ref_name }}.apk

      - name: Publish KITT Holo Portrait
        uses: softprops/action-gh-release@v3
        with:
          repository: tdater/KITT-Holo-Portrait-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          name: KITT Holo Portrait ${{ github.ref_name }}
          body_path: release/notes-KITT-Holo-Portrait.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/KITT-Holo-Portrait-${{ github.ref_name }}.apk
