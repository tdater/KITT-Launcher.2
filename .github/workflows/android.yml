name: Android build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KITT_KEYSTORE_BASE64: ${{ secrets.KITT_KEYSTORE_BASE64 }}
      KITT_KEYSTORE_PASSWORD: ${{ secrets.KITT_KEYSTORE_PASSWORD }}
      KITT_KEY_ALIAS: ${{ secrets.KITT_KEY_ALIAS }}
      KITT_KEY_PASSWORD: ${{ secrets.KITT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Signed release for in-app updates, when the signing secrets are configured.
      - name: Signed release APK
        if: env.KITT_KEYSTORE_BASE64 != ''
        run: |
          echo "$KITT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kitt.jks"
          KITT_KEYSTORE="$RUNNER_TEMP/kitt.jks" ./gradlew assembleRelease

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
