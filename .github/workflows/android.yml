name: Android build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One codebase, two editions (product flavors): kitt2 = KITT Launcher.2, kitt = KITT Launcher.
# A tag (v1.8) releases both, each to its own downloads repo for its in-app updater.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KITT_KEYSTORE_BASE64: ${{ secrets.KITT_KEYSTORE_BASE64 }}
      KITT_KEYSTORE_PASSWORD: ${{ secrets.KITT_KEYSTORE_PASSWORD }}
      KITT_KEY_ALIAS: ${{ secrets.KITT_KEY_ALIAS }}
      KITT_KEY_PASSWORD: ${{ secrets.KITT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes list the commits since the previous tag

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5 # v6+ caching needs Gradle's proprietary terms

      # The editions share every source file but two tiny class stubs, so tests and lint run once.
      - name: Unit tests, lint and debug APKs
        run: |
          chmod +x gradlew
          ./gradlew testKitt2DebugUnitTest lintKitt2Debug assembleKitt2Debug assembleKittDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/kitt2/debug/app-kitt2-debug.apk
            app/build/outputs/apk/kitt/debug/app-kitt-debug.apk

      # Signed releases for in-app updates, when the signing secrets are configured.
      - name: Signed release APKs
        if: env.KITT_KEYSTORE_BASE64 != ''
        run: |
          echo "$KITT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kitt.jks"
          KITT_KEYSTORE="$RUNNER_TEMP/kitt.jks" ./gradlew assembleKitt2Release assembleKittRelease

      # Tags publish each signed APK to its public downloads-only repository, which that
      # edition's in-app updater checks. RELEASES_TOKEN must be allowed to write both.
      - name: Prepare releases
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/kitt2/release/app-kitt2-release.apk') != ''
        run: |
          cp app/build/outputs/apk/kitt2/release/app-kitt2-release.apk "KITT-Launcher.2-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/kitt/release/app-kitt-release.apk "KITT-Launcher-$GITHUB_REF_NAME.apk"
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          for edition in "KITT Launcher.2" "KITT Launcher"; do
            {
              echo "$edition $GITHUB_REF_NAME"
              echo
              echo "Download the APK below and open it on the head unit, or use KITT Config → Updates."
              echo
              echo "Changes:"
              git log --no-merges --pretty='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" | head -40
            } > "release-notes-${edition// /-}.md"
          done

      - name: Publish KITT Launcher.2
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/kitt2/release/app-kitt2-release.apk') != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: tdater/KITT-Launcher.2-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          name: KITT Launcher.2 ${{ github.ref_name }}
          body_path: release-notes-KITT-Launcher.2.md
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.8-beta1: only beta-channel units see it
          files: KITT-Launcher.2-${{ github.ref_name }}.apk

      - name: Publish KITT Launcher
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/kitt/release/app-kitt-release.apk') != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: tdater/KITT-Launcher-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          name: KITT Launcher ${{ github.ref_name }}
          body_path: release-notes-KITT-Launcher.md
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.8-beta1: only beta-channel units see it
          files: KITT-Launcher-${{ github.ref_name }}.apk
