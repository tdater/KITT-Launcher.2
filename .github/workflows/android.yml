name: Android build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KITT_KEYSTORE_BASE64: ${{ secrets.KITT_KEYSTORE_BASE64 }}
      KITT_KEYSTORE_PASSWORD: ${{ secrets.KITT_KEYSTORE_PASSWORD }}
      KITT_KEY_ALIAS: ${{ secrets.KITT_KEY_ALIAS }}
      KITT_KEY_PASSWORD: ${{ secrets.KITT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes list the commits since the previous tag

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5 # v6+ caching needs Gradle's proprietary terms

      - name: Unit tests, lint and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Signed release for in-app updates, when the signing secrets are configured.
      - name: Signed release APK
        if: env.KITT_KEYSTORE_BASE64 != ''
        run: |
          echo "$KITT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kitt.jks"
          KITT_KEYSTORE="$RUNNER_TEMP/kitt.jks" ./gradlew assembleRelease

      # Tags (v1.2) publish the signed APK to the public downloads-only repository, which the
      # in-app updater checks. Needs a RELEASES_TOKEN secret allowed to write its releases.
      - name: Prepare release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk "KITT-Launcher-$GITHUB_REF_NAME.apk"
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "KITT Launcher $GITHUB_REF_NAME"
            echo
            echo "Download the APK below and open it on the head unit, or use KITT Config → Updates."
            echo
            echo "Changes:"
            git log --no-merges --pretty='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" | head -40
          } > release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: tdater/KITT-Launcher-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          name: KITT Launcher ${{ github.ref_name }}
          body_path: release-notes.md
          files: KITT-Launcher-${{ github.ref_name }}.apk
