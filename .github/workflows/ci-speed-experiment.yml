name: CI speed experiment

# Temporary: compares emulator settings for the smoke test. Removed once the results are in.
on:
  push:
    branches: [claude/ci-speed-experiment]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [Kitt2, HoloPortrait]
        variant:
          - { name: baseline, cores: 2, gpu: swiftshader_indirect }
          - { name: cores4, cores: 4, gpu: swiftshader_indirect }
          - { name: swangle, cores: 2, gpu: swangle_indirect }
          - { name: cores4-swangle, cores: 4, gpu: swangle_indirect }
    name: ${{ matrix.flavor }} ${{ matrix.variant.name }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build app and test APKs
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ matrix.flavor }}Debug assemble${{ matrix.flavor }}DebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: ${{ matrix.variant.cores }}
          disable-animations: true
          disk-size: 3G
          emulator-options: -no-window -gpu ${{ matrix.variant.gpu }} -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell wm size 1280x720
            adb shell wm density 160
            echo "test start $(date -u +%T)"
            ./gradlew connected${{ matrix.flavor }}DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.aiconsole.kittlauncher2.LauncherSmokeTest
            echo "test end $(date -u +%T)"
