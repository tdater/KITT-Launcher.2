name: Holo Portrait perf diagnostic

on:
  push:
    branches: [claude/holo-portrait-perf-diag]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run:
          - { flavor: HoloPortrait, pkg: com.aiconsole.kittdual.portrait, size: 800x1151 }
          - { flavor: HoloPortrait, pkg: com.aiconsole.kittdual.portrait, size: 1280x720 }
          - { flavor: HoloLandscape, pkg: com.aiconsole.kittdual.landscape, size: 1280x720 }
          - { flavor: HoloLandscape, pkg: com.aiconsole.kittdual.landscape, size: 800x1151 }
    name: ${{ matrix.run.flavor }} ${{ matrix.run.size }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test with sampling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 3G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/diag/perf-sample.sh ${{ matrix.run.pkg }} ${{ matrix.run.flavor }} ${{ matrix.run.size }}
