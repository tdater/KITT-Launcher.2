name: Smoke test timing, main vs fix

on:
  push:
    branches: [claude/holo-portrait-perf-diag]

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: [main, claude/holo-portrait-smoke-speed]
        edition:
          - { flavor: Kitt2, size: 1280x720 }
          - { flavor: Kitt, size: 800x1151 }
          - { flavor: HoloLandscape, size: 1280x720 }
          - { flavor: HoloPortrait, size: 800x1151 }
        attempt: [1, 2]
    name: ${{ matrix.ref }} ${{ matrix.edition.flavor }} ${{ matrix.attempt }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift
      - uses: actions/checkout@v7
        with:
          path: diagtools
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: app-src
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Timed smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 3G
          working-directory: app-src
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ../diagtools/.github/diag/smoke-time.sh ${{ matrix.edition.flavor }} ${{ matrix.edition.size }}
