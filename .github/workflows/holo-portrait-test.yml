name: Holo Portrait isolated test
on:
  push:
    branches: [holo-v2.2-upgrade]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: holo-portrait-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portrait-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Apply checked compatibility patches
        run: |
          python3 tools/apply-holo-speech-fixes.py
          python3 tools/apply-holo-visual-fixes.py
      - name: Save exact integrated source changes
        run: git diff --check && git diff > speech-fixes.patch
      - name: Test, lint and build Holo Portrait debug APK
        run: |
          chmod +x gradlew
          ./gradlew testHoloPortraitDebugUnitTest lintHoloPortraitDebug assembleHoloPortraitDebug
      - name: Name test APK
        run: cp app/build/outputs/apk/holoPortrait/debug/app-holoPortrait-debug.apk KITT-Holo-Portrait-v2.1.1-holo-test.apk
      - uses: actions/upload-artifact@v7
        with:
          name: KITT-Holo-Portrait-v2.1.1-holo-test
          path: KITT-Holo-Portrait-v2.1.1-holo-test.apk
      - name: Upload patch and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: holo-portrait-test-diagnostics
          path: |
            speech-fixes.patch
            app/build/reports/
